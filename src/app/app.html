<div class="site">
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" routerLink="/">{{ profile.brand }}</a>

      <nav class="nav" aria-label="Main navigation">
        <a
          class="nav-link"
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Home
        </a>
        <a class="nav-link" routerLink="/projects" routerLinkActive="is-active">Projects</a>
        <a class="nav-link" routerLink="/stack" routerLinkActive="is-active">Tech Stack</a>
        <a class="nav-link" routerLink="/contact" routerLinkActive="is-active">Contact</a>
      </nav>

      <a
        hlmBtn
        class="resume-btn"
        [href]="profile.resumeUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        Resume
      </a>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p class="footer-copy">© {{ year }} Mikhail (chebupell). Built for performance.</p>
      <div class="footer-links">
        <a [href]="social('github')?.url" target="_blank" rel="noopener noreferrer">Github</a>
        <a [href]="social('linkedin')?.url" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a [href]="social('github')?.url + '/cv'" target="_blank" rel="noopener noreferrer">
          Source
        </a>
      </div>
      <p class="footer-status">
        <span class="status-dot" aria-hidden="true"></span>
        System Operational
      </p>
    </div>
  </footer>
</div>
